name: Build Football Rivals APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Download Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Verify project parses
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/FootballRivals-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-rivals-debug-apk
          path: build/FootballRivals-debug.apk
          if-no-files-found: error
          retention-days: 14
