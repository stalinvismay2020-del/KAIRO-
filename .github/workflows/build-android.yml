name: Build Eclipse Strikers APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'
          accept-android-sdk-licenses: true

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Download Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Verify Android export templates
        run: |
          set -eux
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          test -f "$TEMPLATE_DIR/android_source.zip"
          rm -rf android/build

      - name: Verify project parses
        run: Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/eclipse-strikers-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/eclipse-strikers-debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # Set Android signing values in Godot's editor settings; environment
          # variables alone are not reliably read by all Godot 4.3 export builds.
          cat >> "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          export/android/keystore/debug = "$RUNNER_TEMP/eclipse-strikers-debug.keystore"
          export/android/keystore/debug_user = "androiddebugkey"
          export/android/keystore/debug_password = "android"
          EOF

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          Godot_v4.3-stable_linux.x86_64 --verbose --headless --path . --export-debug "Android" build/EclipseStrikers-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-strikers-debug-apk
          path: build/EclipseStrikers-debug.apk
          if-no-files-found: error
          retention-days: 14
